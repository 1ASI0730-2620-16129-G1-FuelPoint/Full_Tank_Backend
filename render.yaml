# Academic AV2: both resources use Render Free. PostgreSQL expires after 30 days.
projects:
  - name: fulltank-av2
    environments:
      - name: av2
        databases:
          - name: fulltank-av2-postgres
            databaseName: fulltank_av2
            user: fulltank
            plan: free
            region: oregon
            postgresMajorVersion: '18'
            ipAllowList: []
        services:
          - type: web
            name: fulltank-av2-api
            runtime: docker
            branch: main
            region: oregon
            plan: free
            dockerfilePath: ./Dockerfile
            dockerContext: .
            autoDeployTrigger: checksPass
            healthCheckPath: /health
            envVars:
              - key: ASPNETCORE_ENVIRONMENT
                value: Production
              - key: PORT
                value: '10000'
              - key: DATABASE_URL
                fromDatabase:
                  name: fulltank-av2-postgres
                  property: connectionString
              - key: Database__ApplyMigrationsOnStartup
                value: 'true'
              - key: Database__SeedDemoData
                value: 'true'
              - key: Database__DemoPassword
                generateValue: true
              - key: TokenSettings__Secret
                generateValue: true
              - key: Cors__AllowedOrigins__0
                value: https://full-tank-964e2.web.app
              - key: Cors__AllowedOrigins__1
                value: https://full-tank-964e2.firebaseapp.com
              - key: AcademicDemo__Enabled
                value: 'true'
              - key: PaymentSettings__EnableSimulation
                value: 'true'
              - key: Swagger__Enabled
                value: 'true'
              - key: Hosting__HttpsRedirectionEnabled
                value: 'false'

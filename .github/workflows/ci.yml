name: Backend checks
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore full-tank-platform.sln
      - run: dotnet build full-tank-platform.sln --configuration Release --no-restore
      - run: dotnet test full-tank-platform.sln --configuration Release --no-build
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project TechnoSac.FullTank.Platform --configuration Release --no-build
  postgres-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production API image
        run: docker build -t fulltank-av2-api:local .
      - name: Check PostgreSQL, TLS, migrations and simulated checkout
        run: python3 deploy/smoke_render.py

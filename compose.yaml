services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: fulltank_platform
      POSTGRES_USER: fulltank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting PostgreSQL}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fulltank -d fulltank_platform']
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
